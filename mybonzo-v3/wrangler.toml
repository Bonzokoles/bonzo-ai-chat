name = "mybonzo-v3"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "mybonzo.com/*", zone_name = "mybonzo.com" },
  { pattern = "www.mybonzo.com/*", zone_name = "mybonzo.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mybonzo"
database_id = "84f0f3cb-7778-4cc4-a6ba-e823ef52f1f3"

[ai]
binding = "AI"

[browser]
binding = "MY_BROWSER"

[vars]
OMNIROUTE_URL = "http://127.0.0.1:20128/v1"
DEFAULT_REQUIREMENT = "free_unlimited"
name = "mybonzo-v3"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "mybonzo.com/*", zone_name = "mybonzo.com" },
  { pattern = "www.mybonzo.com/*", zone_name = "mybonzo.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mybonzo"
database_id = "84f0f3cb-7778-4cc4-a6ba-e823ef52f1f3"

[ai]
binding = "AI"

[browser]
binding = "MY_BROWSER"

[vars]
DEFAULT_REQUIREMENT = "free_unlimited"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
